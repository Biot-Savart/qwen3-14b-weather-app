<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Weather App</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🌍 Weather Explorer</h1>
    <input type="text" id="locationSearch" placeholder="Search city or coordinates" />
    <button onclick="getLocation()">Use My Location</button>
  </header>

  <main>
    <div id="currentWeather"></div>
    <div id="forecast"></div>
    <div id="map"></div>
  </main>

  <footer>
    <p>Powered by <a href="https://open-meteo.com/">Open-Meteo</a> & <a href="https://leafletjs.com/">Leaflet</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
